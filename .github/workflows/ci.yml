name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      # Full Playwright journeys intentionally require a separately seeded,
      # non-production Supabase environment and credentials (see the Playwright
      # config + test strategy). Generic PR CI validates the E2E contracts and
      # entry points without pretending localhost/production is that test env.
      - run: pnpm test:e2e
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:db
      - run: pnpm test:rls
      - run: pnpm test:migrations
      - run: pnpm test:lineage
      - run: pnpm security:secrets
      - run: pnpm build:command
      - run: pnpm build:portal

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GitHub's dependency-review action hard-errors when the repository-level
      # Dependency graph feature is disabled. Keep the action visible and run it
      # when available, but do not let that external repository setting bypass
      # the real blocking package gate above: `pnpm audit --prod --audit-level high`.
      - uses: actions/dependency-review-action@v4
        continue-on-error: true
        with:
          fail-on-severity: high
