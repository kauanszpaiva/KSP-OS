name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:db
      - run: pnpm test:rls
      - run: pnpm test:migrations
      - run: pnpm security:secrets
      - run: pnpm build:command
      - run: pnpm build:portal

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Non-blocking: dependency-review-action hard-errors unless the repo has
    # Dependency graph + GitHub Advanced Security enabled. Until that is turned
    # on (Settings -> Security & analysis) the job cannot run, so it must not
    # gate merges. It stays here and will enforce fail-on-severity once enabled.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
