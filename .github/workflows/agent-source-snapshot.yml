name: agent-source-snapshot

on:
  pull_request:
    branches: [main]

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: ksp-os-source
          path: .
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
