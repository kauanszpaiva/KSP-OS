name: apply-task-delivery-feature

on:
  push:
    branches:
      - feat/task-delivery-evidence-notifications

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/task-delivery-evidence-notifications
          fetch-depth: 0
      - name: Reassemble and verify patch
        shell: bash
        run: |
          cat .agent/task-delivery.patch.part* > /tmp/task-delivery.patch
          echo "752c587b4d7c78621d3edb20600b7fdbe08fb462cd3d895f49ec4dfac0eceb79  /tmp/task-delivery.patch" | sha256sum -c -
          git apply --check /tmp/task-delivery.patch
      - name: Apply feature and guards
        shell: bash
        run: |
          git apply /tmp/task-delivery.patch
          node scripts/check-format.mjs
          node scripts/check-source.mjs
          node scripts/check-migrations.mjs
          node scripts/check-rls.mjs
      - name: Commit clean feature branch
        shell: bash
        run: |
          rm -f .agent/task-delivery.patch.part*
          rmdir .agent 2>/dev/null || true
          rm -f .github/workflows/agent-source-snapshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: standardize task delivery evidence and completion notifications"
          git push origin HEAD:feat/task-delivery-evidence-notifications
