# KSP Command one-shot internal login bootstrap against canonical KSPCENTER only.
# This branch is operational; production source remains main.
name: setup-login

on:
  workflow_dispatch:
  push:
    branches: [claude/login-fix-ecf2g2]
    paths:
      - .github/workflows/setup-login.yml
      - scripts/provision-users.json

concurrency:
  group: setup-login-kspcenter
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://rmaxqwbjizivkhurvuvx.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_-0aveLl4f5ZbtooQWa_lRg_E3MG4eEB
      SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      LOGIN_PASSWORD: ${{ secrets.KSP_LOGIN_PASSWORD }}
      PROVISION_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Validate KSPCENTER credentials and schema
        run: |
          set -euo pipefail
          [ -n "$SECRET_KEY" ] && echo "::add-mask::$SECRET_KEY"
          [ -n "$LOGIN_PASSWORD" ] && echo "::add-mask::$LOGIN_PASSWORD"

          if [ -z "${SECRET_KEY:-}" ]; then
            echo "::error::SUPABASE_SECRET_KEY is missing."
            exit 1
          fi
          if [ -z "${LOGIN_PASSWORD:-}" ]; then
            echo "::error::KSP_LOGIN_PASSWORD is missing."
            exit 1
          fi
          if [ "$NEXT_PUBLIC_SUPABASE_URL" != "https://rmaxqwbjizivkhurvuvx.supabase.co" ]; then
            echo "::error::Refusing any target except canonical KSPCENTER."
            exit 1
          fi

          admin_status=$(curl -sS -o /tmp/admin.json -w '%{http_code}'             "$NEXT_PUBLIC_SUPABASE_URL/auth/v1/admin/users?page=1&per_page=1"             -H "apikey: $SECRET_KEY"             -H "Authorization: Bearer $SECRET_KEY")
          if [ "$admin_status" != "200" ]; then
            echo "::error::Stored SUPABASE_SECRET_KEY is not authorized for KSPCENTER (HTTP $admin_status)."
            exit 1
          fi

          for table in profiles organizations organization_memberships; do
            status=$(curl -sS -o "/tmp/${table}.json" -w '%{http_code}'               "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/${table}?select=*&limit=0"               -H "apikey: $SECRET_KEY"               -H "Authorization: Bearer $SECRET_KEY")
            if [ "$status" != "200" ]; then
              echo "::error::Canonical table ${table} is unavailable (HTTP $status)."
              exit 1
            fi
          done

          echo "KSPCENTER credential and canonical schema verification passed."

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Provision internal users
        if: env.PROVISION_ENABLED == 'true'
        run: |
          set -euo pipefail
          export SUPABASE_SERVER_ONLY_SECRET_KEY="$SECRET_KEY"
          export PROVISION_PASSWORD="$LOGIN_PASSWORD"
          jq -c '.[]' scripts/provision-users.json | while read -r user; do
            PROVISION_EMAIL=$(jq -r '.email' <<<"$user")             PROVISION_NAME=$(jq -r '.name' <<<"$user")             PROVISION_ROLE=$(jq -r '.role' <<<"$user")             node scripts/provision-internal-user.mjs
          done

      - name: Verify login end to end
        if: env.PROVISION_ENABLED == 'true'
        run: |
          set -euo pipefail
          export VERIFY_PASSWORD="$LOGIN_PASSWORD"
          jq -r '.[].email' scripts/provision-users.json | while read -r email; do
            VERIFY_EMAIL="$email" node scripts/verify-login.mjs
          done
          echo "All provisioned users can sign in and resolve an internal session."

      - name: Read-only validation complete
        if: env.PROVISION_ENABLED != 'true'
        run: echo "Read-only validation completed; no Auth user was created or changed."
