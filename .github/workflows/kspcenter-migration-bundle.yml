name: KSPCENTER Migration Bundle

on:
  push:
    branches:
      - chore/kspcenter-promotion-preflight-20260917
    paths:
      - '.github/workflows/kspcenter-migration-bundle.yml'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify migration inventory
        shell: bash
        run: |
          set -euo pipefail
          test -d supabase/migrations
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print | sort > migration-files.txt
          test -s migration-files.txt
          wc -l migration-files.txt
      - name: Upload exact migration chain
        uses: actions/upload-artifact@v4
        with:
          name: kspcenter-rehearsal-migrations
          path: |
            supabase/migrations/*.sql
            migration-files.txt
          if-no-files-found: error
          retention-days: 1
